# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  default:
    cmds:
      - task: check
      - task: test

  dev:
    desc: Start both frontend and backend development servers concurrently
    deps: [dev:frontend, dev:backend]

  dev:frontend:
    desc: Start frontend development server
    cmds:
      - deno task dev

  dev:backend:
    desc: Start Rust backend server
    dir: backend
    cmds:
      - cargo run

  build:
    desc: Build both frontend and backend
    deps: [build:frontend, build:backend]

  build:frontend:
    desc: Build frontend
    cmds:
      - task: fmt
      - task: check
      - deno task build

  build:backend:
    desc: Build Rust backend (Release mode)
    dir: backend
    cmds:
      - cargo build --release

  test:
    desc: Run all unit tests (frontend and backend)
    deps: [test:frontend, test:backend]

  test:frontend:
    desc: Run frontend unit tests
    cmds:
      - deno task test

  test:backend:
    desc: Run Rust backend unit tests
    dir: backend
    cmds:
      - cargo test

  check:
    desc: Run all type checks, linting, and Rust checks
    cmds:
      - deno task check
      - deno task lint
      - cd backend && cargo check && cargo clippy --all-targets --all-features

  fmt:
    desc: Run formatters (oxfmt)
    cmds:
      - deno task fmt

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf docs node_modules
      - rm -rf backend/target
