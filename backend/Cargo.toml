[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.37.0", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
uuid = { version = "1.8.0", features = ["v4"] }
futures-util = "0.3.30"
tower-http = { version = "0.7", features = ["cors"] }
dashmap = "6.0"
rand = "0.9"
